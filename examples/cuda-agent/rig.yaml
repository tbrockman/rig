# yaml-language-server: $schema=https://raw.githubusercontent.com/tbrockman/rig/main/schema/rig.schema.json
# A GPU VM for an unattended agent. Fill in your card: lspci -Dnn | grep -i nvidia
host:
  devices:
    gpu:
      kind: gpu
      pci: 0000:2b:00.0
      id: 10de:abcd
      return:
        modules: [nvidia_drm, nvidia_modeset, nvidia_uvm, nvidia]
        reset: true
        alive: drm/card*

guest:
  name: cuda-agent
  flake: ./guest
  cpus: 8
  memory: 16GiB
  disk: 40GiB
  env_file: ~/.config/rig/cuda-agent.env
  devices: [gpu]
  # With witmproxy on the host (rig proxy setup), the key never enters the VM:
  # the agent holds a stand-in, and the proxy puts the real key into this one
  # call to Anthropic and nothing else.
  # proxy:
  #   credentials:
  #     ANTHROPIC_API_KEY: [POST api.anthropic.com/v1/messages]
