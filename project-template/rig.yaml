# yaml-language-server: $schema=https://raw.githubusercontent.com/tbrockman/rig/main/schema/rig.schema.json
# What this VM is given. Nothing is given unless it is listed here.
#
#   rig apply -f rig.yaml --start    # create the VM, or bring it back to this file
#   rig doctor <vm>                  # report where the VM has drifted from it
#   rig delete -f rig.yaml           # remove it (its volumes stay)
#
# The shape is Compose's where Compose has one. Unknown keys are errors.

# Devices on THIS host a VM may be given. `lspci -Dnn` lists PCI addresses and
# ids, `lsusb` USB ids. A PCI device must sit alone in its IOMMU group.
host:
  devices:
    # A graphics card (NVIDIA; the guest needs rig.nixosModules.nvidia).
    # `rig init` filled in this host's, if it found one. `id` is what must be
    # at that address; `return` is how the host takes it back after rig stop.
    #
    # gpu:
    #   kind: gpu
    #   pci: GPU_PCI
    #   id: GPU_ID
    #   return:
    #     modules: [nvidia_drm, nvidia_modeset, nvidia_uvm, nvidia]
    #     reset: true
    #     alive: drm/card*

    # A whole USB controller: everything plugged into it appears in the guest.
    #
    # usb-ctl:
    #   kind: pci
    #   pci: 0000:3c:00.3
    #   id: 1022:1111
    #   return: { reset: true, alive: "usb*" }

    # One USB device by vendor:product; the host keeps the controller.
    #
    # mouse:
    #   kind: usb
    #   id: 1234:5678

guest:
  name: PROJECT
  flake: ./guest                  # nixosConfigurations.guest in guest/flake.nix; or image: <alias>
  cpus: 4                         # or pinned host CPUs: "4-7,12-15"
  memory: 8GiB
  disk: 40GiB
  # devices: [gpu]
  # env_file: ~/.config/rig/PROJECT.env   # KEY=VALUE, injected to tmpfs on start
  # agent: claude-code            # which harness `rig agent` runs; this is the default
  # proxy:                        # credentials the guest never holds (rig proxy setup, once per host)
  #   credentials:                # the guest gets a stand-in; the proxy puts the real value into
  #     ANTHROPIC_API_KEY: [POST api.anthropic.com/v1/messages]   # these endpoints, and nowhere else
  #   egress: internet            # and everything else its NIC may reach, for the agent's tools (cargo, git, nix)
  # volumes:                      # named volumes; they outlive the VM
  #   - "PROJECT-data:/srv/data"
  # ports:                        # host:guest/proto, published on the network through the ACL
  #   - "8080:80/tcp"
  # forwards: [5173]              # guest ports on this host's 127.0.0.1 over vsock; isolation untouched
  # agent:                        # or just `agent: claude-code`; `rig agent start` reads these as defaults
  #   prompt_file: brief.md       # the brief, relative to this file
  #   workdir: /work/PROJECT
  #   model: claude-fable-5-1
  #   timeout: 6h                 # kill one run after this long and resume: a hang backstop
  #   idle_timeout: 20m           # kill a run with no tool call for this long and resume: the better backstop
  #   memory_max: 80%             # MemoryMax= on the agent's unit, inside the VM's memory
  #   until_done: true            # resume at each turn boundary until the agent runs `rig done`
  #   budgets:                    # hard limits: crossing one stops the agent, session kept
  #     hours: 24
  #     tokens: 50000000
  #     usage: { window: five_hour, max: 0.9 }   # a subscription window, for an OAuth login
  #     restarts: 10
  #   watch:                      # soft thresholds: each is a `rig agent watch` event; on: adds a message
  #     idle_minutes: 120         # no commit on the workdir's branch
  #     unit_minutes: 30          # a transient unit the agent started, still running
  #     status_minutes: 90        # STATUS.md untouched
  #     usage: { window: five_hour, max: 0.7 }
  #     on:
  #       idle: { send: "No commit in two hours. Say in STATUS.md what you are waiting on." }
  #       status: { send: "STATUS.md is stale. Rewrite it." }
  # network: none                 # no network device at all
  # input: host                   # lend the host's keyboard and mouse (desktop module)
